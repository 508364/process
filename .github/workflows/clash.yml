name: Update Clash Config

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动运行一次
  workflow_dispatch:       # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Subconverter (处理 Base64/URI 转换)
        run: |
          wget -qO- https://github.com/tindy2013/subconverter/releases/download/v0.7.2/subconverter_linux64.tar.gz | tar xz
          chmod +x subconverter/subconverter
          mv subconverter/subconverter .
          rm -rf subconverter

      - name: Download Mihomo (Clash.Meta 多线程测速核心)
        run: |
          wget -qO- https://github.com/MetaCubeX/mihomo/releases/download/v1.18.8/mihomo-linux-amd64-compatible-v1.18.8.gz | gunzip > mihomo
          chmod +x mihomo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Run processing script
        run: python process.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add clash.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update clash.yaml $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
