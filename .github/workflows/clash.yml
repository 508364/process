name: Update Clash Config

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动运行一次
  workflow_dispatch:       # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Native Git Checkout
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Download Subconverter
        run: |
          echo "⬇️ 下载 subconverter..."
          wget -qO- https://github.com/tindy2013/subconverter/releases/download/v0.7.2/subconverter_linux64.tar.gz | tar xz
          chmod +x subconverter/subconverter
          mv subconverter/subconverter .
          rm -rf subconverter
          echo "✅ subconverter 准备就绪"

      - name: Download Mihomo
        run: |
          echo "⬇️ 下载 mihomo..."
          wget -qO- https://github.com/MetaCubeX/mihomo/releases/download/v1.18.8/mihomo-linux-amd64-compatible-v1.18.8.gz | gunzip > mihomo
          chmod +x mihomo
          echo "✅ mihomo 准备就绪"

      - name: Install Python dependencies (使用 apt 绕过 PEP 668 限制)
        run: |
          echo "⬇️ 安装 Python 依赖..."
          sudo apt-get update -y
          sudo apt-get install -y python3-yaml python3-requests
          echo "✅ Python 依赖安装完成"

      - name: Run processing script
        run: python3 process.py

      - name: Commit and push changes
        run: |
          git add clash.yaml
          if git diff --staged --quiet; then
            echo "✅ 节点无更新，跳过提交"
          else
            git commit -m "chore: auto-update clash.yaml $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
